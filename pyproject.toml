[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart"
version = "1.0.0"
description = "This is a quickstart example for Flower"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.18.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch==2.5.1",
    "torchvision==0.20.1",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "trinhtnp"

[tool.flwr.app.components]
serverapp = "quickstart.quickstart.server_app:app"
clientapp = "quickstart.quickstart.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10
fraction-fit = 1 # actual run node = num-supernodes * fraction-fit
local-epochs = 1

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 9
